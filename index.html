<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#10151F" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;background:#F4F6FA}
@media (prefers-color-scheme: dark){html{background:#10151F}}

<title>Polski Test 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one-column phone app on squared notebook paper; teacher's red pen for grades and marks, ink blue for actions */
:root{
  --paper:#F4F6FA; --grid:rgba(60,100,170,.09); --card:#FFFFFF; --ink:#18202E; --muted:#5A667A; --line:#D7DFEA;
  --blue:#2450C4; --blue-soft:#E5ECFB; --on-blue:#FFFFFF;
  --pen:#CC2237; --pen-soft:#FCE7EA; --ok:#17794A; --ok-soft:#E2F3E9;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Source Sans 3',system-ui,-apple-system,sans-serif;
  --f-hand:'Caveat','Bradley Hand','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151F; --grid:rgba(130,165,230,.07); --card:#18202D; --ink:#E7ECF4; --muted:#95A2B6; --line:#2B3547;
  --blue:#88A8FF; --blue-soft:#1D2A49; --on-blue:#0E1526;
  --pen:#FF6577; --pen-soft:#3A1C25; --ok:#4FCB8E; --ok-soft:#14322A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151F; --grid:rgba(130,165,230,.07); --card:#18202D; --ink:#E7ECF4; --muted:#95A2B6; --line:#2B3547;
  --blue:#88A8FF; --blue-soft:#1D2A49; --on-blue:#0E1526;
  --pen:#FF6577; --pen-soft:#3A1C25; --ok:#4FCB8E; --ok-soft:#14322A; color-scheme:dark}

body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.app.quiz{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.05}
p{margin:0}
.eyebrow{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lede{color:var(--muted);font-size:15.5px;max-width:60ch}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding-top:6px}
.hero>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.when{color:var(--muted);font-size:15px}
.when b{color:var(--pen);font-weight:700}
.grade-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.grade{font-family:var(--f-hand);font-weight:700;font-size:62px;line-height:1;color:var(--pen);width:88px;height:88px;display:grid;place-items:center;border:3px solid var(--pen);border-radius:52% 46% 55% 44% / 48% 55% 45% 52%;transform:rotate(-7deg)}
.grade-lbl{font-family:var(--f-hand);font-size:21px;color:var(--pen);line-height:1}
.cta{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;border-radius:16px;padding:18px 20px;background:var(--blue);color:var(--on-blue);text-align:left}
.cta span{font-family:var(--f-display);font-weight:800;font-size:24px}
.cta small{font-size:15px;opacity:.85}
.cta2{width:100%;border:2px solid var(--pen);background:var(--pen-soft);color:var(--pen);border-radius:14px;padding:13px 18px;font-weight:700;text-align:left}
.sec{font-size:19px;font-weight:600;margin-top:6px}
.decks{display:flex;flex-direction:column;gap:10px}
.deck{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.dn{font-weight:700;font-size:17.5px;min-width:0}
.dp{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);font-size:15px}
.de{grid-column:1/-1;color:var(--muted);font-size:14.5px}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--blue-soft);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:3px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px;color:var(--muted)}
.ghost.armed{border-color:var(--pen);color:var(--pen)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qx{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.bar{flex:1;height:8px;background:var(--blue-soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.count{font-variant-numeric:tabular-nums;font-size:14.5px;color:var(--muted);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;gap:10px;align-items:flex-start}
.prompt{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.2;flex:1;min-width:0;overflow-wrap:anywhere}
.prompt.big{font-size:56px;font-weight:800}
.sub{color:var(--muted);font-size:15.5px}
.blank{display:inline-block;min-width:2.6em;height:.9em;border-bottom:3px solid var(--blue);margin:0 .12em;vertical-align:-.05em}
.spk{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.spk svg{width:20px;height:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;font-size:17.5px;line-height:1.3}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft);color:var(--pen);text-decoration:line-through}
.opt:disabled{cursor:default}
.typed{display:flex;flex-direction:column;gap:10px}
.typed input{width:100%;box-sizing:border-box;font:inherit;font-size:23px;font-weight:600;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.typed input:focus{border-color:var(--blue);outline:none}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:40px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:19px;font-weight:600}
.check{width:100%;border:0;border-radius:13px;padding:14px;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:18px}
.fb{display:flex;flex-direction:column;gap:8px;border-radius:16px;padding:14px 16px;border:1.5px solid var(--line);background:var(--card)}
.fb.r{border-color:var(--ok)} .fb.w,.fb.a{border-color:var(--pen)}
.mark{font-family:var(--f-hand);font-weight:700;font-size:32px;line-height:1}
.fb.r .mark{color:var(--ok)} .fb.w .mark,.fb.a .mark{color:var(--pen)}
.ansline{display:flex;gap:10px;align-items:center}
.ansline p{flex:1;min-width:0;font-size:19px;font-weight:700}
.note{color:var(--muted);font-size:15px}
.next{width:100%;border:0;border-radius:13px;padding:14px;background:var(--ink);color:var(--paper);font-weight:700;font-size:18px}

/* results */
.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:26px;color:var(--muted)}
.miss{display:flex;flex-direction:column;gap:8px}
.miss li{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.miss ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.miss .q{color:var(--muted);font-size:14.5px}
.miss .a{font-weight:700}
.row{display:flex;flex-direction:column;gap:10px}

/* sheet */
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
details[open]{padding-bottom:14px}
summary{font-family:var(--f-display);font-weight:600;font-size:19px;padding:12px 0;cursor:pointer}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.say{color:var(--blue);cursor:pointer}
td.say:active{opacity:.6}
.tip{font-size:15px;color:var(--muted);margin-top:10px}
.tip b{color:var(--ink)}

/* learning path + ladder */
.stage{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stage-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stage-h p{font-weight:700;font-size:17.5px;min-width:0}
.stage-h span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;flex:none}
.path{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.path i{display:block;height:9px;border-radius:5px;background:var(--blue-soft);overflow:hidden}
.path i b{display:block;height:100%;background:var(--blue)}
.path i.cur{outline:2px solid var(--blue);outline-offset:1px}
.ladder{display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px;color:var(--muted)}
.ladder span{border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.next.alt{background:var(--pen-soft);color:var(--pen)}
.hint{font-family:var(--f-hand);font-size:24px;color:var(--blue);line-height:1.1}
.intro .meaning{color:var(--muted);font-size:16px}
.intro .prompt b,.fill{color:var(--blue)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--blue-soft);color:var(--blue);margin-left:6px;vertical-align:2px}
.ov{align-self:flex-start}

.plan{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.plan p{font-size:15.5px;color:var(--muted)} .plan b{color:var(--ink)}
.seg{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.seg span{font-size:14px;color:var(--muted);margin-right:4px}
.seg button{min-width:46px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}

.gw{border-bottom:1.5px dotted currentColor;cursor:help;border-radius:3px}
.gw.on{background:var(--blue-soft)}
#tip{position:fixed;z-index:30;display:flex;flex-direction:column;gap:3px;max-width:min(300px,calc(100vw - 32px));background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:14.5px;font-weight:600;line-height:1.3;padding:7px 11px;border-radius:9px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}

.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.behind{background:var(--pen-soft);color:var(--pen)}
.meter.tm{height:10px;margin-top:0;border-radius:5px}
.today .tline{font-size:15.5px;font-variant-numeric:tabular-nums}

#tip b{font-size:15.5px}
#tip .tf{font-weight:600;opacity:.8;font-size:13.5px}
#tip .ty{font-weight:400;opacity:.92;font-size:13.5px}

.btab td{font-size:16.5px}
.btab .end{color:var(--blue)}
.sayrow{cursor:pointer}.sayrow:active td{background:var(--blue-soft)}
.fam{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.fam p:empty{display:none}
.ttab td{vertical-align:middle;padding:6px 6px}
.ttab .tl{color:var(--muted);font-size:14.5px;width:42%}
.ttab input{width:100%;box-sizing:border-box;font:inherit;font-size:19px;font-weight:600;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.ttab input:focus{border-color:var(--blue);outline:none}
.ttab input.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ttab input.almost{border-color:var(--pen);background:var(--pen-soft)}
.ttab input.bad{border-color:var(--pen);background:var(--pen-soft);color:var(--pen);text-decoration:line-through}
.ttab .given{font-size:19px;font-weight:600;color:var(--muted);padding-left:11px}
.ttab .corr{display:block;font-weight:700;color:var(--ok);padding:4px 0 0 2px}

.gw-plain{border-bottom:0;cursor:pointer}
button.grade-wrap{background:none;border:0;padding:0;font:inherit}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px}
.stat b{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stat b small{font-size:15px;color:var(--muted);font-weight:600}
.stat span{font-size:13px;color:var(--muted)}
.trow{display:flex;align-items:center;gap:10px}.trow .meter{flex:1;min-width:0}

p.diff{font-size:21px;font-weight:600;letter-spacing:.01em;line-height:1.5;overflow-wrap:anywhere}
.diff del,.dkey del{color:var(--pen);text-decoration:line-through;text-decoration-thickness:2px;background:var(--pen-soft);border-radius:3px}
.diff ins,.dkey ins{color:var(--ok);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;background:var(--ok-soft);border-radius:3px}
.dkey{white-space:nowrap}

.mix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mixl{grid-column:1/-1;font-size:14px;color:var(--muted)}
.stp{display:grid;grid-template-columns:32px 1fr 32px;grid-template-rows:auto auto;align-items:center;justify-items:center;column-gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:5px 5px 3px}
.stp button{width:32px;height:32px;padding:0;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:19px;font-weight:700;line-height:1}
.stp b{font-family:var(--f-display);font-size:20px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.stp small{grid-column:1/-1;font-size:12px;color:var(--muted)}

.kn{display:none}
@media (hover:hover) and (pointer:fine){.kn{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-right:10px;border:1px solid var(--line);border-radius:5px;font:600 12px/1 var(--f-body);color:var(--muted);vertical-align:2px}}
.opt.khit{border-color:var(--blue);background:var(--blue-soft)}
.ktyped{font-size:14px;color:var(--muted);margin-top:-4px}

.muted{color:var(--muted);font-size:14px}

#review{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rv-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--paper);padding:12px 0;max-width:560px;margin:0 auto;border-bottom:1px solid var(--line)}
.rv-bar span{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.rv-back{border:0;border-radius:11px;padding:10px 12px;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:14.5px}
.rv-body{max-width:560px;margin:14px auto 0;display:flex;flex-direction:column;gap:16px;opacity:.95}
.qx:disabled{opacity:.35}

.opt.done{cursor:help}
.opt .omean{display:block;font-size:14px;font-weight:600;margin-top:4px;text-decoration:none;opacity:.9}
.opt.wrong .omean{text-decoration:none}
.opt.wrong{text-decoration:none}.opt.wrong .ot{text-decoration:line-through}

.conf{background:var(--blue-soft);color:var(--ink);border-radius:10px;padding:8px 10px}

.hidl summary{cursor:pointer;color:var(--muted);font-size:15px;padding:6px 0}
.hidrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.hidrow .ghost{text-align:left}
.hidebtn{align-self:center;font-size:13.5px;padding:6px 10px}

#go-nut{border-color:var(--ink);color:var(--ink);background:var(--card)}

.drills{display:flex;flex-wrap:wrap;gap:8px}
.drill{background:var(--card);color:var(--ink);font-weight:600;font-size:15px;padding:10px 12px;border-radius:12px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;gap:8px}
.nav button{flex:1;max-width:220px;background:none;border:0;padding:12px 8px 14px;font-weight:700;font-size:15.5px;color:var(--muted);border-top:3px solid transparent}
.nav button[aria-current="page"]{color:var(--blue);border-top-color:var(--blue)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<main class="app" id="app"></main>
<nav class="nav" id="nav">
  <button id="t-home" aria-current="page">Ćwicz · Practice</button>
  <button id="t-sheet">Ściąga · Cheat sheet</button>
</nav>

<script>
/* ---------- content (from the Test 1 overview slide + lessons 0–1) ---------- */
const QA=[

/* letter-level comparison with the closest correct answer: what is wrong, missing or extra */
function editOps(a,b){const n=a.length,m=b.length,D=Array.from({length:n+1},(_,i)=>{const r=new Array(m+1).fill(0);r[0]=i;return r});
 for(let j=0;j<=m;j++)D[0][j]=j;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:strip(a[i-1])===strip(b[j-1])?0.5:1));
 const ops=[];let i=n,j=m;
 while(i>0||j>0){if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+(a[i-1]===b[j-1]?0:strip(a[i-1])===strip(b[j-1])?0.5:1)){ops.push(a[i-1]===b[j-1]?['=',a[i-1]]:['~',a[i-1],b[j-1]]);i--;j--}
  else if(i>0&&D[i][j]===D[i-1][j]+1){ops.push(['-',a[i-1]]);i--}else{ops.push(['+',b[j-1]]);j--}}
 return{dist:D[n][m],ops:ops.reverse()}}
function closeDiff(given,cands){const g=norm(given);if(!g)return null;let best=null;
 cands.forEach(c=>{const t=norm(c.replace(/^For example: /,''));if(!t)return;const r=editOps(g,t);if(!best||r.dist<best.dist)best={...r,t}});
 if(!best||best.dist===0||best.dist>Math.max(2,best.t.length*0.3))return null;
 const html=best.ops.map(([o,x,y])=>o==='='?esc(x):o==='~'?`<del>${esc(x)}</del><ins>${esc(y)}</ins>`:o==='-'?`<del>${esc(x)}</del>`:`<ins>${esc(x)}</ins>`).join('');
 const n=best.ops.filter(o=>o[0]!=='=').length;return{html,n}}

async function pushCloud(){
 if(!cloud||cloudBusy||!cloudDirty)return;cloudBusy=true;cloudDirty=false;
 try{await cloud.set({s:S,at:Date.now()});syncState='cloud';cloudRetried=false}
 catch(e){const c=e&&e.code;
  if(c==='unavailable'&&!cloudRetried){cloudRetried=true;cloudDirty=true;cloudBusy=false;setTimeout(pushCloud,1500+Math.random()*1500);return}
  syncState='local';if(c&&c!=='unavailable'&&c!=='resource_exhausted')cloud=null}
 cloudBusy=false;updSync();if(cloudDirty)scheduleSync()}
function mergeS(a,b){const out={};
 new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{if(k[0]==='_')return;const x=a[k],y=b[k];
  out[k]=!x?{...y}:!y?{...x}:(y.n>x.n||(y.n===x.n&&y.b>x.b))?{...y}:{...x}});
 const t=dayKey(),da=a._d&&a._d.d===t?a._d.n:0,db_=b._d&&b._d.d===t?b._d.n:0;
 if(da||db_)out._d={d:t,n:Math.max(da,db_)};
 const r=Math.max(a._r||0,b._r||0);if(r)out._r=r;
 const ta=a._t&&a._t.d===t?a._t:null,tb=b._t&&b._t.d===t?b._t:null;
 if(tb||ta)out._t={...(tb||ta),r:Math.max(ta?ta.r:0,tb?tb.r:0)};const pc=a._p||b._p;if(pc)out._p=pc;const mx=a._mix||b._mix;if(mx)out._mix=mx;['_hide','_show'].forEach(k=>{if(a[k]||b[k])out[k]={...(b[k]||{}),...(a[k]||{})}});const ac=a._acc||b._acc;if(ac)out._acc=ac;
 if(a._bk||b._bk)out._bk={...(a._bk||{}),...(b._bk||{})};const sd=a._seed||b._seed;if(sd)out._seed=sd;return out}

const box=id=>S[id]?S[id].b:-1;
const weight=id=>{const b=box(id);return b<0?2.5:[4,2.5,1,.5,.25][Math.min(b,4)]};
/* a term counts as known at level 2+, and only fully while it has no fresh mistakes */
const isKnown=id=>box(id)>=2&&!(S[id].ws>0);
const mastery=its=>its.reduce((s,it)=>s+Math.min(Math.max(box(it.id),0),2)/2*(S[it.id]&&S[it.id].ws?0.5:1),0)/its.length;
const GRADES=[[.9,6,'celujący'],[.75,5,'bardzo dobry'],[.6,4,'dobry'],[.45,3,'dostateczny'],[.3,2,'dopuszczający'],[0,1,'niedostateczny']];
const gradeOf=m=>{const g=GRADES.find(g=>m>=g[0]);return{n:g[1],name:g[2]}};
const weakItems=()=>ITEMS.filter(it=>S[it.id]&&S[it.id].w>0&&(S[it.id].b<2||S[it.id].ws>0));
const dayKey=()=>{const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
const todayCount=()=>S._d&&S._d.d===dayKey()?S._d.n:0;
/* spacing: a right answer sits out 1, 2, 4, 7… rounds; a mistake is due again right away */
const round=()=>S._r||0;
/* round mix: new / mistakes to fix / review of last-time-right; 20 written answers by default */
const DEF_MIX={n:8,m:8,c:4};const mix=()=>({...DEF_MIX,...(S._mix||{})}),pace=()=>mix().n;
const GAP=[0,1,2,4,7,12,20];
/* right: up a level · wrong: back next round, and down one level only after 3 wrong in a row ·
   minor slip (accent, hint): no change in level */
function record(id,res){const s=S[id]||{b:0,n:0,w:0,f:dayKey()};s.n++;
 if(res==='right'){s.b=Math.min(s.b+1,6);s.ws=0;s.dr=0;s.due=round()+1+GAP[s.b];s.lr='r'}
 else if(res==='wrong'){s.w++;s.ws=(s.ws||0)+1;if(s.ws>=3){s.b=Math.max(0,s.b-1);s.ws=0;s.dr=1}s.due=round();s.lr='w'}

function ask(){
 if(sess.i>=sess.queue.length)return results();
 const cur=sess.queue[sess.i],b0=box(cur.it.id),stage=sess.test?'write':cur.st||(b0<1?'pick':'write'),q=cur.it.make(stage==='write'?'write':'pick');cur.q=q;const b=b0;
 if(!cur.st)cur.st=sess.test?'write':b<0?'intro':b<1&&q.options?'pick':'write';
 if(sess.test)cur.st='write';
 if(cur.st==='intro'&&b>=0)cur.st=b<1&&q.options?'pick':'write';
 if(cur.st==='pick'&&!q.options)cur.st='write';
 if(cur.it.pattern&&cur.st==='pick')cur.st='write';
 if(!sess.test&&cur.it.block&&!blockSeen(cur.it.block)&&(cur.st==='intro'||!cur.it.member))return showBlock(cur,cur.it.block);
 if(cur.st==='intro'&&cur.it.pattern){if(!S[cur.it.id]){S[cur.it.id]={b:1,n:0,w:0,due:round(),f:dayKey()};sess.fresh++;save()}cur.st='write'}
 q.kind=cur.st==='intro'?'intro':cur.st==='pick'?'mc':q.reveal?'reveal':'type';
 const canHint=!sess.test&&q.kind==='type';let usedHint=false;
 const level=sess.test?'':q.kind==='intro'?'<span class="tag">nowe</span>':q.kind==='mc'?`<span class="tag">warm-up${cur.slot==='fix'&&S[cur.it.id]&&S[cur.it.id].dr?' · dropped a level':cur.slot==='new'?' · new':''}</span>`:q.kind==='type'?`<span class="tag">write · counts${cur.slot==='fix'?' · to fix':cur.slot==='rev'?' · review':cur.slot==='new'?' · new':''}</span>`:'';

 if(q.kind==='intro'){
  const inBlank=q.prompt.includes('___');
  app.innerHTML=`${topBar(cur)}
  <article class="card intro"><p class="eyebrow">${esc(q.eyebrow)}${level}</p>
   ${inBlank?`<div class="prow">${promptHTML(q,q.answer,1)}${spkBtn(q.sayAns)}</div>`
     :q.reveal?`<div class="prow"><h2 class="prompt">${gl(q.prompt)}</h2>${spkBtn(q.say)}</div><p class="meaning">${esc(q.answer)}</p>`
     :`<p class="meaning">${q.say?gl(q.prompt):esc(q.prompt)}${q.sub?' · '+esc(q.sub):''}</p><div class="prow"><h2 class="prompt">${gl(q.mcAnswer||q.answer)}</h2>${spkBtn(q.sayAns)}</div>`}
   ${q.note?`<p class="note">${esc(q.note)}</p>`:''}
   ${q.also?`<p class="note"><b>Any of these works:</b> ${gl(q.also)}</p>`:''}
  </article>
  <div class="two"><button class="check" id="got">Mam! · Got it</button><button class="next" id="knowit" style="background:var(--blue-soft);color:var(--blue)">I know this · test me later</button></div>
  <button class="ghost ov" id="hideit">Hide this term · not now</button>`;
  $('#qx').onclick=home;
  if(autoAudio)say(q.sayAns);
  $('#knowit').onclick=()=>{S[cur.it.id]={b:1,n:0,w:0,due:round()+2,f:dayKey()};save();sess.fresh++;sess.put({it:cur.it,st:'write',slot:'new'},3);next()};
  $('#hideit').onclick=()=>hideAndSkip(cur.it.id);
  $('#got').onclick=()=>{S[cur.it.id]={b:0,n:0,w:0,due:round(),f:dayKey()};save();sess.fresh++;sess.put({it:cur.it,st:'pick',slot:'new'},3);next()};
  $('#got').focus({preventScroll:true});
  return;
 }

 <article class="card"><p class="eyebrow">${esc(q.eyebrow)}${level}${cur.retry?' · second try':''}</p>

     <div class="two"><button class="check" type="submit">Sprawdź · Check</button>${canHint?'<button class="next alt" type="button" id="hb">Podpowiedź · hint</button>':''}</div></form>`}
 <div id="fb"></div>`;

   if(autoAudio)say(q.sayAns);
   $('#kn').onclick=()=>finish('right','',null,true);$('#dk').onclick=()=>finish('wrong','',null,true)}}
 else{const ti=$('#ti');ti.focus();
   app.querySelectorAll('.keys button').forEach(k=>k.onclick=()=>{const s=ti.selectionStart??ti.value.length,e=ti.selectionEnd??s;ti.value=ti.value.slice(0,s)+k.dataset.k+ti.value.slice(e);ti.focus();ti.setSelectionRange(s+1,s+1)});
   const hb=$('#hb');if(hb)hb.onclick=()=>{usedHint=true;$('#hintx').hidden=false;hb.disabled=true;ti.focus()};
   $('#tf').onsubmit=e=>{e.preventDefault();if(ti.readOnly){next();return}if(!ti.value.trim())return;
     const g=norm(ti.value);let r;

     if(usedHint&&r.res==='right')r.res='hint';
     ti.readOnly=true;app.querySelector('.keys').hidden=true;app.querySelector('#tf .two').hidden=true;finish(r.res,ti.value,r.msg)}}

const MARKS={hint:['Dobrze, z podpowiedzią.'],right:['Dobrze!','Bardzo dobrze!','Świetnie!','Brawo!'],accent:['Prawie! Uwaga na ogonki.'],wrong:['Niestety…','Jeszcze nie.']};
function finish(res,given,msg,quick){
 const cur=sess.queue[sess.i],q=cur.q,id=cur.it.id;
 const prev=S[id]?{...S[id]}:null,prevDay=S._d?{...S._d}:null;
 sess.done=sess.done||new Set();
 const warmup=q.kind==='mc'&&!sess.test,counts=!warmup&&!cur.retry&&!sess.done.has(id)&&!cur.it.tmp;if(counts)sess.done.add(id);
 if(counts)record(id,res);else{S._d={d:dayKey(),n:todayCount()+1};save()}
 const entry={it:cur.it,q,res,given,retry:cur.retry,counts,firstTry:!warmup&&!cur.retry,slot:cur.slot};sess.log.push(entry);
 let requeued=false;
 /* warm-up: a miss gets one more warm-up; after that (right or not) the written answer follows, exactly once */
 if(warmup){if(res!=='right'&&!cur.again)sess.put({it:cur.it,st:'pick',slot:cur.slot,again:1},2);else sess.put({it:cur.it,st:'write',slot:cur.slot},3)}
 else if(res!=='right'&&sess.nut&&(cur.tries||1)<3){sess.put({it:cur.it,st:'write',retry:true,tries:(cur.tries||1)+1,slot:cur.slot},3);requeued=true}
 else if(res!=='right'&&!cur.retry&&!sess.nut){sess.queue.push({it:cur.it,st:'write',retry:true,slot:cur.slot});requeued=true}
 sess.answeredAt=sess.i;saveSess();
 if(quick)return next();
 let shown=q.kind==='mc'?(q.mcAnswer||q.answer):q.answer;
 if(q.open&&res==='right')shown=given;else if(q.open&&q.kind==='mc'){const vo=q.options.find(o=>q.valid.includes(o));if(vo)shown=vo}
 let tgt=q.table||(q.reveal&&q.kind!=='type')?null:(q.kind==='type'&&q.accept?q.accept[0]:(q.mcAnswer||q.answer));
 if(tgt){if(/[.!?…] \/ /.test(tgt))tgt=tgt.split(' / ')[0];tgt=tgt.replace(/pan \/ pani/g,'pani');if(/^\d+$/.test(tgt)||/^For example/.test(tgt))tgt=null}
 const pe=app.querySelector('.card .prompt');
 if(pe&&!q.table&&(q.say||q.prompt.includes('___')))pe.outerHTML=promptHTML(q,q.prompt.includes('___')?(q.mcAnswer||q.answer):null,1);
 const cls=res==='right'||res==='hint'?'r':res==='accent'?'a':'w';
 $('#fb').innerHTML=`<div class="fb ${cls}"><p class="mark">${pick(MARKS[res])}</p>
  ${res!=='right'&&res!=='hint'&&tgt?'<button class="next alt" id="drill">Write it 3 times</button>':''}
  ${res!=='right'&&q.kind==='type'?(()=>{const d=closeDiff(given,q.accept||q.valid||[q.answer]);
    return d?`<p class="diff" aria-label="Your answer with corrections">${d.html}</p><p class="note">Close: ${d.n===1?'one letter':d.n+' letters'} to fix. <span class="dkey"><del>red</del> = wrong or extra, <ins>green</ins> = should be there.</span></p>`
     :`<p class="note">You wrote: <b>${esc(given)}</b></p>`})():''}
  ${q.table?'':`<div class="ansline"><p>${res==='accent'?'Spelled: ':''}${q.reveal?esc(shown):gl(shown)}</p>${spkBtn(q.sayAns)}</div>`}

 async function gh(path,opt){const r=await fetch(API+path,{...opt,headers:hdr()});if(!r.ok){const e=new Error(r.status===401?'The token was not accepted. Create a new one and paste it again.':r.status===403||r.status===404?'The token has no access to gists. Make sure the “gist” box is ticked.':'GitHub answered '+r.status+'.');e.status=r.status;throw e}return r.json()}
 async function findGist(){let id=get(GI);if(id)return id;
  const list=await gh('/gists?per_page=100');const g=list.find(x=>x.description===DESC);
  if(g){set(GI,g.id);return g.id}
  const c=await gh('/gists',{method:'POST',body:JSON.stringify({description:DESC,public:false,files:{'progress.json':{content:JSON.stringify(S)}}})});set(GI,c.id);return c.id}
 async function syncNow(){if(!get(TK)||state.busy)return;state.busy=true;state.msg='Syncing…';draw();
  try{const id=await findGist();let g;try{g=await gh('/gists/'+id)}catch(e){if(e.status===404){set(GI,null);state.busy=false;return syncNow()}throw e}
   const f=g.files&&g.files['progress.json'];let remote={};
   if(f){let txt=f.content;if(f.truncated){txt=await (await fetch(f.raw_url)).text()}try{remote=JSON.parse(txt)||{}}catch(e){remote={}}}
   const merged=mergeS(S,remote);
   if(!sess){const before=JSON.stringify(S);S=merged;saveLocal();if(JSON.stringify(S)!==before&&view==='home')home()}
   if(JSON.stringify(merged)!==JSON.stringify(remote))await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:{'progress.json':{content:JSON.stringify(merged)}}})});
   state.last=new Date();state.msg=''}
  catch(e){state.msg=e.message||'Could not reach GitHub. Progress is safe on this device and syncs next time.'}
  state.busy=false;draw()}
 window.onProgressSaved=()=>{if(!get(TK))return;clearTimeout(timer);timer=setTimeout(syncNow,4000)};
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
 function draw(){const el=document.getElementById('sync');if(!el)return;const on=!!get(TK);
  if(form){el.innerHTML=`<span class="sy-box"><b>Sync between devices</b>
   <span>1. On GitHub, <a href="https://github.com/settings/tokens/new?scopes=gist&description=Polski%20sync" target="_blank" rel="noopener">create a token</a> with only the “gist” box ticked, then tap Generate token and copy it.</span>
   <span>2. Paste it here. Do the same on your other device with the same token.</span>
   <input id="sy-in" type="password" autocomplete="off" placeholder="ghp_…" aria-label="GitHub token">
   <span class="sy-row"><button class="ghost" id="sy-save">Save and sync</button><button class="ghost" id="sy-x">Cancel</button></span></span>`;
   document.getElementById('sy-save').onclick=()=>{const v=document.getElementById('sy-in').value.trim();if(!v)return;set(TK,v);set(GI,null);form=false;syncNow()};
   document.getElementById('sy-x').onclick=()=>{form=false;draw()};return}
  const t=state.last?state.last.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):null;
  el.innerHTML=on?`${state.msg&&state.msg!=='Syncing…'?'Sync problem: '+esc(state.msg):state.msg==='Syncing…'?'Syncing…':`Synced between your devices${t?' · last at '+t:''}`} <button class="sy-link" id="sy-now">Sync now</button> <button class="sy-link" id="sy-off">Turn off</button>`
   :`Progress is saved on this device only. <button class="sy-link" id="sy-on">Sync between devices</button>`;
  const b1=document.getElementById('sy-on');if(b1)b1.onclick=()=>{form=true;draw()};
  const b2=document.getElementById('sy-now');if(b2)b2.onclick=syncNow;
  const b3=document.getElementById('sy-off');if(b3)b3.onclick=()=>{set(TK,null);set(GI,null);state.last=null;state.msg='';draw()}}
 window.updSync=draw;draw();syncNow();
})();
</script>

</style>
