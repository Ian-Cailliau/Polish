<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Polski">
<meta name="theme-color" content="#F2EDE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161A24" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;background:#F2EDE5}
@media (prefers-color-scheme: dark){html:not([data-theme="light"]){background:#161A24}}
html[data-theme="dark"]{background:#161A24}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}[hidden]{display:none!important}
</style>
</head><body>
<title>Polski Test 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>/* the look chosen in Ustawienia → Wygląd (jasny / ciemny), set before the page is drawn; without one the system decides */
try{const t=localStorage.getItem('pl-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Poltawski+Nowy:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: one-column phone app. Theme “Kraków”, after the folk costume: granat (navy) for actions, coral of the
   korale necklace for the teacher's red pen, grades and the progress beads, on cream. Low contrast on purpose.
   Type: Półtawski Nowy (revival of Adam Półtawski's Polish book typeface) for headings and Polish sentences, Lato for the rest. */
:root{
  --paper:#F2EDE5; --slate:#E6DFD3; --grid:transparent; --card:#FBF8F3; --ink:#252D44; --muted:#66697A; --line:#E2D9CB;
  --blue:#3B4A79; --blue-soft:#E2E5EF; --on-blue:#FBF8F3;
  --pen:#C25A4C; --pen-soft:#F6E2DD; --ok:#4F7A57; --ok-soft:#E2ECDF;
  --btn:#2F3B62; --on-btn:#FBF8F3; --tile:#3B4A79; --on-tile:#FBF8F3; --bead:#C25A4C; --bead-off:#ECD3CD; --shade:rgba(47,59,98,.35);
  --f-display:'Poltawski Nowy',Georgia,'Times New Roman',serif;
  --f-body:'Lato',system-ui,-apple-system,sans-serif;
  --f-hand:'Caveat','Bradley Hand','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161A24; --slate:#262C3B; --grid:transparent; --card:#1E2330; --ink:#E3DED5; --muted:#A2A4B2; --line:#2F3546;
  --blue:#9AA9DE; --blue-soft:#262E49; --on-blue:#151925;
  --pen:#EE8A7C; --pen-soft:#3B2426; --ok:#86C391; --ok-soft:#1D3227;
  --btn:#46548C; --on-btn:#ECE7DE; --tile:#38446F; --on-tile:#ECE7DE; --bead:#EE8A7C; --bead-off:#3E2D31; --shade:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161A24; --slate:#262C3B; --grid:transparent; --card:#1E2330; --ink:#E3DED5; --muted:#A2A4B2; --line:#2F3546;
  --blue:#9AA9DE; --blue-soft:#262E49; --on-blue:#151925;
  --pen:#EE8A7C; --pen-soft:#3B2426; --ok:#86C391; --ok-soft:#1D3227;
  --btn:#46548C; --on-btn:#ECE7DE; --tile:#38446F; --on-tile:#ECE7DE; --bead:#EE8A7C; --bead-off:#3E2D31; --shade:rgba(0,0,0,.35); color-scheme:dark}

body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.app.quiz{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.05}
p{margin:0}
.eyebrow{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lede{color:var(--muted);font-size:15.5px;max-width:60ch}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding-top:6px}
.hero>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.when{color:var(--muted);font-size:15px}
.when b{color:var(--pen);font-weight:700}
.grade-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.grade{font-family:var(--f-hand);font-weight:700;font-size:62px;line-height:1;color:var(--pen);width:88px;height:88px;display:grid;place-items:center;border:3px solid var(--pen);border-radius:52% 46% 55% 44% / 48% 55% 45% 52%;transform:rotate(-7deg)}
.grade-lbl{font-family:var(--f-hand);font-size:21px;color:var(--pen);line-height:1}
.cta{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;border-radius:16px;padding:18px 20px;background:var(--tile);color:var(--on-tile);text-align:left}
.cta>span{font-family:var(--f-display);font-weight:800;font-size:24px}
.cta small{font-size:15px;opacity:.85}
.cta2{width:100%;border:2px solid var(--pen);background:var(--pen-soft);color:var(--pen);border-radius:14px;padding:13px 18px;font-weight:700;text-align:left}
.sec{font-size:19px;font-weight:600;margin-top:6px}
.decks{display:flex;flex-direction:column;gap:10px}
.deck{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.dn{font-weight:700;font-size:17.5px;min-width:0}
.dp{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);font-size:15px}
.de{grid-column:1/-1;color:var(--muted);font-size:14.5px}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--blue-soft);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:3px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px;color:var(--muted)}
.ghost.armed{border-color:var(--pen);color:var(--pen)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qx{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.bar{flex:1;height:8px;background:var(--blue-soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
/* progress through a round as a string of coral beads (korale krakowskie): done, the current one as a ring, still to come */
.beads{flex:1;min-width:0;display:flex;align-items:center;gap:4px;height:12px}
.beads i{flex:1 1 0;max-width:10px;aspect-ratio:1;border-radius:50%;background:var(--bead-off)}
.beads i.on{background:var(--bead)}.beads i.now{background:transparent;box-shadow:inset 0 0 0 2px var(--bead)}
.count{font-variant-numeric:tabular-nums;font-size:14.5px;color:var(--muted);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 22px -16px var(--shade)}
.prow{display:flex;gap:10px;align-items:flex-start}
.prompt{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.2;flex:1;min-width:0;overflow-wrap:anywhere}
.prompt.big{font-size:56px;font-weight:800}
.sub{color:var(--muted);font-size:15.5px}
.blank{display:inline-block;min-width:2.6em;height:.9em;border-bottom:3px solid var(--blue);margin:0 .12em;vertical-align:-.05em}
.spk{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.spk svg{width:20px;height:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;font-size:17.5px;line-height:1.3}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--pen);background:var(--pen-soft);color:var(--pen);text-decoration:line-through}
.opt:disabled{cursor:default}
.typed{display:flex;flex-direction:column;gap:10px}
.typed input{width:100%;box-sizing:border-box;font:inherit;font-size:23px;font-weight:600;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.typed input:focus{border-color:var(--blue);outline:none}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:40px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:19px;font-weight:600}
.check{width:100%;border:0;border-radius:13px;padding:14px;background:var(--tile);color:var(--on-tile);font-weight:700;font-size:18px}
.fb{display:flex;flex-direction:column;gap:8px;border-radius:16px;padding:14px 16px;border:1.5px solid var(--line);background:var(--card)}
.fb.r{border-color:var(--ok)} .fb.w,.fb.a{border-color:var(--pen)}
.mark{font-family:var(--f-hand);font-weight:700;font-size:32px;line-height:1}
.fb.r .mark{color:var(--ok)} .fb.w .mark,.fb.a .mark{color:var(--pen)}
.ansline{display:flex;gap:10px;align-items:center}
.ansline p{flex:1;min-width:0;font-size:19px;font-weight:700}
/* modes: colour of the label, the top of the question card and the answer box */
.app[data-mode="rozmowa"]{--mc:#3B4A79;--ms:#E2E5EF}.app[data-mode="tlum"]{--mc:#2E7A78;--ms:#DDEDEC}.app[data-mode="przeksz"]{--mc:#7A4E7E;--ms:#EEE4EF}
.app[data-mode="konj"]{--mc:#A77D2A;--ms:#F5ECD7}.app[data-mode="dekl"]{--mc:#5F7A4A;--ms:#E6EDDF}.app[data-mode="znacz"]{--mc:#66697A;--ms:#E8E8EC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .app[data-mode]{--ms:color-mix(in srgb,var(--mc) 22%,var(--card))}
 :root:not([data-theme="light"]) .app[data-mode="rozmowa"]{--mc:#9AA9DE}:root:not([data-theme="light"]) .app[data-mode="tlum"]{--mc:#6CC0BC}:root:not([data-theme="light"]) .app[data-mode="przeksz"]{--mc:#C9A0CC}
 :root:not([data-theme="light"]) .app[data-mode="konj"]{--mc:#DDBA6C}:root:not([data-theme="light"]) .app[data-mode="dekl"]{--mc:#A8C58E}:root:not([data-theme="light"]) .app[data-mode="znacz"]{--mc:#A9ABBA}}
:root[data-theme="dark"] .app[data-mode]{--ms:color-mix(in srgb,var(--mc) 22%,var(--card))}
:root[data-theme="dark"] .app[data-mode="rozmowa"]{--mc:#9AA9DE}:root[data-theme="dark"] .app[data-mode="tlum"]{--mc:#6CC0BC}:root[data-theme="dark"] .app[data-mode="przeksz"]{--mc:#C9A0CC}
:root[data-theme="dark"] .app[data-mode="konj"]{--mc:#DDBA6C}:root[data-theme="dark"] .app[data-mode="dekl"]{--mc:#A8C58E}:root[data-theme="dark"] .app[data-mode="znacz"]{--mc:#A9ABBA}
.app[data-mode] .qtop+.card{border-top:4px solid var(--mc)}
.app[data-mode] .typed input{border-color:color-mix(in srgb,var(--mc) 55%,var(--line))}.app[data-mode] .typed input:focus{border-color:var(--mc)}
.app[data-mode] .card .blank{border-bottom-color:var(--mc)}
.lab{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mc,var(--blue));background:var(--ms,var(--blue-soft));border-radius:99px;padding:4px 10px 4px 8px}
.mode svg{width:16px;height:16px;flex:none}
.mdet{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mx{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--paper);border-radius:99px;padding:3px 9px}
.lab .mdet+.mx,.lab .mode+.mx{margin-left:auto}.mx.r{color:var(--pen);background:var(--pen-soft)}
.plate{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;background:var(--ms,var(--blue-soft));border-radius:12px;padding:10px 14px}
.plate b{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--mc,var(--blue));line-height:1.05}
.plate>span{font-size:15.5px}.plate em{font-style:normal;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mc,var(--blue))}
.mirw{position:relative}.mirw .mir{display:none}
.mirw.on .mir{display:block;position:absolute;inset:0;box-sizing:border-box;padding:13px 14px;border:1.5px solid transparent;font-size:23px;font-weight:600;line-height:normal;white-space:pre;overflow:hidden;color:var(--ink);pointer-events:none;display:flex;align-items:center}
.mirw.on input{color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ink);background:transparent;position:relative}
.mirw.on{background:var(--card);border-radius:13px}
.mir ins,.done-typed ins{color:var(--ok);background:var(--ok-soft);text-decoration:none;border-radius:3px}
.done-typed{font-size:21px;font-weight:600}
.dw{background:var(--ms,var(--blue-soft));border-radius:5px;padding:0 3px}.dgap{font-size:19px;font-weight:600}
/* the result sheet after an answer: slides up over the bottom of the screen */
.fb.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:560px;margin:0 auto;box-sizing:border-box;border:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0;
 box-shadow:0 -10px 30px rgba(10,16,28,.16);padding:8px max(18px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));gap:12px;max-height:calc(100dvh - 96px);overflow-y:auto;overscroll-behavior:contain;animation:sheetup .22s ease-out}
@keyframes sheetup{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fb.sheet{animation:none}}
.fb.sheet .grip{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line);flex:none}
.fb.sheet .mark{font-size:30px}
.fb.sheet .ansline p{font-size:20px;line-height:1.35}
.fb.sheet .next{width:100%}
.ansline ins{color:var(--ok);background:var(--ok-soft);text-decoration:none;border-bottom:2px solid var(--ok);border-radius:3px;padding:0 1px}
.yb{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.yb.side{grid-template-columns:repeat(2,minmax(0,1fr))}
.yb .box{background:var(--paper);border-radius:12px;padding:9px 12px 10px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.4;min-width:0}
.yb .box small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.yb .box p{margin:0}.yb .said,.yb .want{font-size:16.5px}.yb .said b{color:var(--pen)}.yb .want{color:var(--ok)}.yb .same{color:var(--ok);font-weight:600}
.yb .box{gap:10px}.yb .yr{display:flex;flex-direction:column;gap:2px}.yb .yr+.yr{border-top:1px solid var(--line);padding-top:9px}.yb .yr small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px;margin-top:-4px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;border-radius:10px;padding:6px 2px;font-size:13.5px;font-weight:600;color:var(--muted)}
.act svg{width:22px;height:22px;color:var(--blue)}.act:hover{background:var(--blue-soft)}
.fbpad{flex:none}
.ser{white-space:nowrap}
.rv-body .fb.sheet{position:static;max-height:none;box-shadow:none;border:1px solid var(--line);border-radius:16px;animation:none}.rv-body .fbpad,.rv-body .grip,.rv-body .acts{display:none}
.note{color:var(--muted);font-size:15px}
.next{width:100%;border:0;border-radius:13px;padding:14px;background:var(--btn);color:var(--on-btn);font-weight:700;font-size:18px}

/* results */
.score{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:26px;color:var(--muted)}
.miss{display:flex;flex-direction:column;gap:8px}
.miss li{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.miss ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.miss .q{color:var(--muted);font-size:14.5px}
.miss .a{font-weight:700}
.row{display:flex;flex-direction:column;gap:10px}

/* sheet */
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
details[open]{padding-bottom:14px}
summary{font-family:var(--f-display);font-weight:600;font-size:19px;padding:12px 0;cursor:pointer}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.say{color:var(--blue);cursor:pointer}
td.say:active{opacity:.6}
.tip{font-size:15px;color:var(--muted);margin-top:10px}
.tip b{color:var(--ink)}

/* learning path + ladder */
.stage{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stage-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stage-h p{font-weight:700;font-size:17.5px;min-width:0}
.stage-h span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;flex:none}
.path{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.path i{display:block;height:9px;border-radius:5px;background:var(--blue-soft);overflow:hidden}
.path i b{display:block;height:100%;background:var(--blue)}
.path i.cur{outline:2px solid var(--blue);outline-offset:1px}
.ladder{display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px;color:var(--muted)}
.ladder span{border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.next.alt{background:var(--pen-soft);color:var(--pen)}
.hint{font-family:var(--f-hand);font-size:24px;color:var(--blue);line-height:1.1}
.hint p{margin:2px 0}
.intro .meaning{color:var(--muted);font-size:16px}
.intro .prompt b,.fill{color:var(--blue)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--blue-soft);color:var(--blue);margin-left:6px;vertical-align:2px}
.ov{align-self:flex-start}

.plan{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.plan p{font-size:15.5px;color:var(--muted)} .plan b{color:var(--ink)}
.seg{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.seg span{font-size:14px;color:var(--muted);margin-right:4px}
.seg button{min-width:46px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--tile);border-color:var(--tile);color:var(--on-tile)}
.theme-seg button{flex:1;padding:0 12px;font-weight:600;color:var(--ink)}.theme-seg button[aria-pressed="true"]{color:var(--on-tile)}.theme-seg button .gw,.theme-seg button .gx{color:inherit}

/* letter-level comparison with the closest correct answer: what is wrong, missing or extra */
function editOps(a,b){const n=a.length,m=b.length,D=Array.from({length:n+1},(_,i)=>{const r=new Array(m+1).fill(0);r[0]=i;return r});

 const ops=[];let i=n,j=m;

/* ---------- every form of every word, tagged ---------- */
const FORMS=new Map();
const lo=s=>String(s).toLowerCase();
const idx=(w,an)=>{const k=lo(w);let a=FORMS.get(k);if(!a)FORMS.set(k,a=[]);if(!a.some(x=>x.e===an.e&&x.case===an.case&&x.num===an.num&&x.g===an.g&&x.pers===an.pers&&x.vf===an.vf&&x.anim===an.anim))a.push(an)};
/* adjective endings: -y / -a / -e …, -i and -ie after k and g (polski, jaki) */
function adjTable(e){if(e.forms)return e.forms;
 const kg=/[kg]i$/.test(e.lemma),st=e.lemma.slice(0,-1),fx=s=>kg?s.replace(/^y/,'i').replace(/^e/,'ie'):s;
 return [['y','nom','m'],['ego','gen','m'],['emu','dat','m'],['y','acc','m','inan'],['ego','acc','m','anim'],['ym','ins','m'],['ym','loc','m'],
  ['a','nom','f'],['ej','gen','f'],['ej','dat','f'],['ą','acc','f'],['ą','ins','f'],['ej','loc','f'],
  ['e','nom','n'],['ego','gen','n'],['emu','dat','n'],['e','acc','n'],['ym','ins','n'],['ym','loc','n'],
  ['e','nom','nonvir'],['ych','gen','pl'],['ym','dat','pl'],['ych','acc','vir'],['e','acc','nonvir'],['ymi','ins','pl'],['ych','loc','pl']]
  .map(([s,c,g,a])=>[st+fx(s),c,g,a]).concat([[e.vir,'nom','vir']])}
const PLG=g=>g==='vir'||g==='nonvir'||g==='pl';
LEX.forEach(e=>{
 if(e.pos==='noun'||e.pos==='name'){
  if(e.indecl)CASES.forEach(c=>idx(e.lemma,{e,pos:e.pos,case:c,num:'sg',g:e.g}));
  else if(e.sg)e.sg.forEach((f,k)=>idx(f,{e,pos:e.pos,case:CASES[k],num:'sg',g:e.g}));
  if(e.pl){e.pl.forEach((f,k)=>idx(f,{e,pos:e.pos,case:CASES[k],num:'pl',g:e.g}));idx(e.pl[0],{e,pos:e.pos,case:'voc',num:'pl',g:e.g})}}
 else if(e.pos==='verb'){const inf=e.lemma.replace(/ się$/,'');idx(inf,{e,pos:'verb',vf:'inf'});e.f.forEach((f,k)=>idx(f,{e,pos:'verb',vf:'fin',pers:k%3+1,num:k<3?'sg':'pl'}))}
 else if(e.pos==='adj')adjTable(e).forEach(([f,c,g,a])=>idx(f,{e,pos:'adj',case:c,g,num:PLG(g)?'pl':'sg',anim:a}));
 else if(e.pos==='pron')e.forms.forEach(([f,c,g,en,note])=>idx(f,{e,pos:'pron',case:c,g:g||null,num:PLG(g)?'pl':e.num||'sg',pers:e.person,en:en||null,note:note||null}));
 else if(e.forms&&e.pos==='wh')e.forms.forEach(([f,c])=>idx(f,{e,pos:'wh',case:c}));
 else if(e.pos==='num')e.forms.forEach(f=>idx(f,{e,pos:'num'}));
 else if(e.pos==='prep'){idx(e.lemma,{e,pos:'prep'});if(e.variant)idx(e.variant,{e,pos:'prep',variant:1})}
 else idx(e.lemma,{e,pos:e.pos})});
const lookup=w=>FORMS.get(lo(w))||[];
/* the same, ignoring ogonki (Krakow finds Kraków) */
const FORMS_FOLD=new Map();FORMS.forEach((v,k)=>{const f=strip(k);let a=FORMS_FOLD.get(f);if(!a)FORMS_FOLD.set(f,a=[]);v.forEach(x=>a.push(x))});
const foldLookup=w=>FORMS_FOLD.get(strip(lo(w)))||[];
/* the real spelling of a reading found without ogonki */
function surfaceOf(an,g){for(const [k,v] of FORMS)if(strip(k)===strip(lo(g))&&v.includes(an))return k;return null}
const LEMMA=new Map();LEX.forEach(e=>{if(!LEMMA.has(e.lemma))LEMMA.set(e.lemma,e)});
/* one form of a word: form('Polska','gen') → Polski · form('stan','gen','pl') → Stanów */
function form(lemma,c,num){const e=LEMMA.get(lemma);if(!e)return null;
 if(e.pos==='verb')return e.f[c];
 if(e.pos==='adj'){const r=adjTable(e).find(x=>x[1]===c&&(num==='pl'?PLG(x[2]):x[2]===(num||'m')));return r?r[0]:null}
 const list=num==='pl'||!e.sg?e.pl:e.sg;return list?list[CASES.indexOf(c)]:null}
/* z → ze, w → we before a hard cluster (ze Stanów, we Wrocławiu) */
function zeWe(p,next){const n=lo(next||''),V=/^[aeiouyąęó]/;
 if(/^mn/.test(n)||(p==='z'&&/^wszystk/.test(n)))return p+'e';
 const m=p==='z'?n.match(/^(sz|rz|s|z|ś|ź|ż)(.*)$/):n.match(/^(w|f)(.*)$/);
 return m&&m[2]&&!V.test(m[2])?p+'e':p}
/* the plural pronoun for a group: oni as soon as one man is in it */
/* the people in a group, each as a person or thing with a gender; a title decides a name's gender (pani Nowak is a woman) */
function members(ws){const out=[];for(let k=0;k<ws.length;k++){const w=lo(ws[k]),x=lookup(w).find(c=>c.pos==='name'||c.pos==='noun'||c.pos==='pron');if(!x)continue;
  if(x.e.para==='pan'&&x.num==='sg'){out.push({w:ws[k+1]&&lookup(ws[k+1]).some(c=>c.pos==='name')?ws[k+1]:ws[k],g:x.e.g});if(ws[k+1]&&lookup(ws[k+1]).some(c=>c.pos==='name'))k++;continue}
  out.push({w:ws[k],g:x.pos==='pron'?x.g:x.e.vir?'m1':x.e.g})}return out}
const isMan=m=>m.g==='m1'||m.g==='vir';

const SENT_WHO=s=>/\(ty\)/.test(s)?'to one friend · ty':/\(wy\)/.test(s)?'to several friends · wy':/^One /.test(s)?'no men in the group':/^Oni /.test(s)?'men, or a mixed group':/ pani /.test(s)?'formal, to a woman · pani':/ pan /.test(s)?'formal, to a man · pan':'';
/* every accepted way to write a sentence: with or without the bracketed pronoun, czy optional, teraz before or after the verb */
function sentForms(s){const out=new Set(),cap=t=>t.replace(/^\p{Ll}/u,c=>c.toUpperCase());

 for(const b of base){out.add(b);if(/^Czy /.test(b))out.add(cap(b.replace(/^Czy /,'')));
  const m=b.match(/^(.*?)\bteraz (\S+) (.*)$/i);if(m)out.add(cap(`${m[1]}${m[2]} teraz ${m[3]}`.trim()));
  const t=b.match(/^Teraz (.*)$/);if(t)out.add(cap(`${t[1].replace(/[.?!]$/,'')} teraz${b.slice(-1)}`))}

 [...out].forEach(x=>{const m=x.match(/^(On|Ona|Oni|One) (.*)$/);if(m)out.add(cap(m[2]))}); // Polish may leave out on / ona / oni / one too

/* ========== ENGINE:BEGIN ==========
   The learning engine. Pure functions only: no DOM, no localStorage and no app globals, so it runs (and is tested) on its own
   (tests/engine.js reads this block out of app.html). The app wraps it in two services further down: AL (the answer log on
   this device) and MEM (the memory model's predictions).
   · ENGINE.log    the answer log: every answer is an event with a unique id and a time. Devices merge logs by union, so a
                   sync can never lose or double an answer. A reset is a time stamp (resetAt), not a deletion.
   · ENGINE.model  the memory model: from the log, the chance you get a term right at a given moment.
                   Forgetting follows a power law (the FSRS curve). Each term has a stability S (days until recall drops to
                   90%) and a difficulty D (its smoothed error rate). The parameters are estimated with partial pooling:
                   one global set, plus one forgetting multiplier per family of terms that only moves away from 1 when
                   that family has the evidence for it. Families are used only if they predict your newest answers better.
   · ENGINE.pick   Thompson sampling: draws a plausible chance per term and returns the terms sorted by that draw.
   · ENGINE.nut    the drill-to-criterion rule of the Twardy orzech round.
   Units: event times are ms since 1970; inside the model, time is in days. */
const ENGINE=(()=>{
 const VERSION=1,DAY=864e5;
 const clamp=(x,a,b)=>x<a?a:x>b?b:x;
 const logit=p=>Math.log(p/(1-p)),sigm=u=>1/(1+Math.exp(-u));

 /* ---------- log ----------
    An event in memory: {id, t, term, ev, kind, res, sid, att, mode, ref, x}
    id    unique: device + time + counter; 'seed:<term>' for the one-off import of progress from before the log
    t     ms since 1970 · term: the term id (ITEMS[].id)
    ev    'answer' · 'seen' (intro card) · 'known' (“I know this”) · 'easy' (“too easy”) · 'seed' · 'amend' (an answer corrected)
    kind  answers: 'type' · 'table' (written) · 'mc' (multiple choice) · 'reveal' (meaning card, marked yourself)
    res   answers: 'right' · 'wrong' · 'accent' (ogonki) · 'hint'; amend: the corrected result
    sid   the round it was given in · att: attempt number of this term in that round (1 = first) · mode: the kind of round
    ref   amend: the id of the corrected answer · x: extra data (seed: level b, written n, wrong w and
          last result lr of the old progress entry, and its assumed last practice; hint answers: h = hints taken)
    On the wire (sync, storage) events are arrays in FIELDS order, term ids are numbers into a term list, and common values
    get one-letter codes. Unknown values pass through unchanged, so a newer app can add values without breaking an older one. */
 const LOG_VERSION=1,MAX_EVENTS=15000;
 const FIELDS=['id','t','term','ev','kind','res','sid','att','mode','ref','x'];
 const CODES={ev:{answer:'a',seen:'s',known:'k',easy:'e',seed:'d',amend:'m'},kind:{type:'t',table:'b',mc:'m',reveal:'r'},
  res:{right:'r',wrong:'w',accent:'a',hint:'h'},mode:{learn:'n',nut:'o',test:'t',fix:'f',drill:'d',again:'g',deck:'k'}};
 const DECODE={};Object.keys(CODES).forEach(f=>{DECODE[f]={};Object.keys(CODES[f]).forEach(k=>{DECODE[f][CODES[f][k]]=k})});
 const emptyLog=()=>({v:LOG_VERSION,resetAt:0,events:[]});
 const validEvent=e=>!!e&&typeof e.id==='string'&&e.id.length>0&&typeof e.t==='number'&&isFinite(e.t)&&typeof e.term==='string'&&e.term.length>0&&typeof e.ev==='string';
 const byTime=(a,b)=>a.t-b.t||(a.id<b.id?-1:a.id>b.id?1:0);
 /* two copies of the same id: the same answer seen by two devices, so they are equal, except seeds, which each device made
    from its own copy of the old progress: the more-practised one wins (as in the old progress merge), then the earlier one */
 function better(a,b){const na=a.x&&a.x.n||0,nb=b.x&&b.x.n||0;if(na!==nb)return na>nb?a:b;if(a.t!==b.t)return a.t<b.t?a:b;
  return JSON.stringify(a)>=JSON.stringify(b)?a:b}
 /* keeps the newest MAX_EVENTS events; seeds stay (they are each term's starting point and there is at most one per term) */
 function trim(log,max){max=max||MAX_EVENTS;if(log.events.length<=max)return log;
  const seeds=log.events.filter(e=>e.ev==='seed'),rest=log.events.filter(e=>e.ev!=='seed');
  return {...log,events:[...seeds,...rest.slice(Math.max(0,rest.length-Math.max(0,max-seeds.length)))].sort(byTime)}}
 function mergeLogs(a,b){a=a||emptyLog();b=b||emptyLog();const resetAt=Math.max(a.resetAt||0,b.resetAt||0),m=new Map();
  for(const e of [...a.events,...b.events]){if(!validEvent(e)||e.t<resetAt)continue;const o=m.get(e.id);m.set(e.id,o?better(o,e):e)}
  return trim({v:LOG_VERSION,resetAt,events:[...m.values()].sort(byTime)})}
 function encode(log){const terms=[],ix=new Map();
  const e=log.events.map(ev=>{const row=FIELDS.map(f=>{const v=ev[f];if(v===undefined||v===null)return null;
    if(f==='term'){if(!ix.has(v)){ix.set(v,terms.length);terms.push(v)}return ix.get(v)}
    return CODES[f]&&CODES[f][v]!==undefined?CODES[f][v]:v});
   while(row.length&&row[row.length-1]===null)row.pop();return row});
  return {v:LOG_VERSION,resetAt:log.resetAt||0,terms,e}}
 /* null for something that is not a log, or a log written by a newer version of the app (that one must not be overwritten) */
 function decode(o){if(!o||typeof o!=='object'||!Array.isArray(o.e)||!Array.isArray(o.terms))return null;if((o.v|0)>LOG_VERSION)return null;
  const events=[];for(const row of o.e){if(!Array.isArray(row))continue;const ev={};
   FIELDS.forEach((f,i)=>{let v=row[i];if(v===undefined||v===null)return;if(f==='term')v=o.terms[v];else if(DECODE[f]&&typeof v==='string'&&DECODE[f][v]!==undefined)v=DECODE[f][v];if(v!==undefined)ev[f]=v});
   if(validEvent(ev))events.push(ev)}
  return mergeLogs({v:LOG_VERSION,resetAt:+o.resetAt||0,events},null)}

 /* ---------- families: kinds of question that are expected to be forgotten at a similar speed ----------
    A new kind of term needs one line here (first match wins); a term that matches nothing is in 'other'. */
 const FAMILIES=[
  ['qa-self',/^qa:([a-z]+:ans|slychac)$/,'answer about yourself'],
  ['qa-ask',/^qa:[a-z]+:en$/,'ask a friend (ty)'],
  ['qa-formal',/^qa:[a-z]+:(form|inf)$/,'make it formal'],
  ['qa-third',/^qa:[a-z]+:(3|a3)$/,'about someone (on / ona)'],
  ['verb-form',/^v:/,'verb forms'],
  ['verb-sentence',/^vs:/,'verbs in sentences'],
  ['country',/^kr:/,'z + genitive · countries'],
  ['city',/^city:/,'w + locative · cities'],
  ['number',/^n:/,'numbers 0–10'],
  ['sum',/^ile:/,'Ile jest…? · sums'],
  ['classroom',/^cl:/,'classroom phrases'],
  ['word',/^(w:|ab:|qa:milo$)/,'words and abbreviations'],
  ['pronoun',/^(pn:|pf:|oni:)/,'pronouns · oni / one · pan / pani']];
 const familyOf=id=>{for(const f of FAMILIES)if(f[1].test(id))return f[0];return 'other'};
 const familyLabel=k=>{const f=FAMILIES.find(x=>x[0]===k);return f?f[2]:'other'};

 /* ---------- model ---------- */
 const F=19/81,C=-0.5;                    // the FSRS forgetting curve R(t) = (1 + F·t/S)^C: R(S) = 90%, R(12.8·S) = 50%
 const recall=(dt,S)=>dt<=0?1:Math.pow(1+F*dt/S,C);
 const HALF=3/F;                          // half-life = HALF · S
 const MIN_GAP=1/24;                      // an answer tests memory only after an hour away from the term (shorter gaps test short-term memory)
 const MIN_FIT=30,MIN_COMPARE=80,MIN_TEST=20;   // answers after a break needed to fit at all, and to compare global vs per-family
 /* the four global parameters, each with its prior (centre, spread, scale) and its range:
    s0     days until recall drops to 90% after a first correct answer
    gain   how much S grows after a correct answer at R = 90% (S becomes (1 + gain)·S for a term of average difficulty)
    lapse  share of S kept after a miss (never more than s0)
    slip   chance of a slip (typo, ogonek) on a term you do know */
 const DEFAULTS={s0:0.4,gain:1.5,lapse:0.3,slip:0.04};
 const PRIORS={s0:[Math.log(0.4),1.0,'log'],gain:[Math.log(1.5),0.7,'log'],lapse:[logit(0.3),0.8,'logit'],slip:[logit(0.04),0.8,'logit']};
 const BOUNDS={s0:[0.02,20],gain:[0.1,6],lapse:[0.05,0.9],slip:[0.005,0.3]};
 const FAM_SD=0.5,FAM_LIM=2.5;            // prior spread of a family's log multiplier (most families within ×0.37 … ×2.7)
 const D_PRIOR_K=20,D_SEED_K=3,D_RATE=0.3,D_START=0.25;  // difficulty: family prior strength, seed prior strength, update rate, before any data
 const S_MIN=0.005,S_MAX=3650,GROW_MAX=8,GROW_REF=Math.exp(0.15)-1;
 const tf=(k,x)=>PRIORS[k][2]==='log'?Math.log(x):logit(x),itf=(k,u)=>PRIORS[k][2]==='log'?Math.exp(u):sigm(u);
 const clampS=s=>clamp(s,S_MIN,S_MAX);
 const GRADED={ok:1,near:1,lapse:1},clampP=p=>clamp(p,1e-4,1-1e-4);

 /* events → per term, the steps the model reads, in time order: g = ok · near (ogonki, or right after only the first hint,
    x.h = 1: you were told the verb but found the form) · lapse (wrong, or only with more help)
    · seen (shown the answer without writing it) · known · easy · seed. Corrections (amend) are applied to their answer. */
 function prepare(events){const amend=new Map(),by=new Map();
  for(const e of events)if(e.ev==='amend'&&e.ref)amend.set(e.ref,e.res);
  for(const e of events){let st;
   if(e.ev==='answer'){const res=amend.has(e.id)?amend.get(e.id):e.res;
    st=e.kind==='type'||e.kind==='table'?{g:res==='right'?'ok':res==='accent'||res==='hint'&&e.x&&e.x.h===1&&!amend.has(e.id)?'near':'lapse'}:{g:'seen'}}
   else if(e.ev==='seen'||e.ev==='known'||e.ev==='easy')st={g:e.ev};
   else if(e.ev==='seed')st={g:'seed',x:e.x||{}};
   else continue;                        // kinds of event this version does not know: ignored
   st.t=(st.g==='seed'&&st.x&&isFinite(st.x.last)?st.x.last:e.t)/DAY;
   let a=by.get(e.term);if(!a)by.set(e.term,a=[]);a.push(st)}
  by.forEach(a=>a.sort((p,q)=>p.t-q.t));return by}

 /* a family's difficulty prior: its error rate, pooled toward the global rate (only answers before `until` are used) */
 function dPriors(by,until){until=until===undefined?Infinity:until;const n={},e={};let N=0,E=0;
  by.forEach((steps,id)=>{const f=familyOf(id);for(const s of steps){if(s.t>=until)break;
   if(GRADED[s.g]){n[f]=(n[f]||0)+1;N++;if(s.g!=='ok'){e[f]=(e[f]||0)+1;E++}}
   else if(s.g==='seed'){const k=s.x.n|0,w=Math.min(s.x.w|0,k);n[f]=(n[f]||0)+k;N+=k;e[f]=(e[f]||0)+w;E+=w}}});
  const g=(E+D_START*5)/(N+5),out={_:g};Object.keys(n).forEach(f=>{out[f]=((e[f]||0)+D_PRIOR_K*g)/(n[f]+D_PRIOR_K)});
  Object.keys(e).forEach(f=>{if(out[f]===undefined)out[f]=g});return out}

 /* replays one term: returns its state {S, D, last, n}. For every answer after a break, `sink` gets the prediction made just
    before it: an array gets {t, p, y} pushed; an accumulator {lo, hi, ll, n} adds the log-likelihood of those with t in [lo, hi). */
 function replayTerm(steps,P,m,D0,sink){let s=null;const base=P.s0*m,arr=Array.isArray(sink)?sink:null,acc=arr?null:sink;
  for(const st of steps){const t=st.t,g=st.g;
   if(g==='seed'){if(s)continue;const x=st.x,b=clamp(x.b|0,0,6),n=Math.max(0,x.n|0),w=clamp(x.w|0,0,n);
    s={S:clampS(base*Math.pow(2,b)*(n>0?1:0.5)*(x.lr==='w'?P.lapse:1)),D:(D_SEED_K*D0+w)/(D_SEED_K+n),last:t,n:Math.min(n,6),seed:1};continue}
   if(!s){s={S:clampS(g==='ok'?base:g==='near'?base*Math.sqrt(P.lapse):g==='lapse'?base*P.lapse:g==='known'?base*2:base*0.5),
     D:g==='known'?D0*0.5:D0,last:t,n:0};
    if(GRADED[g]){s.D+=D_RATE*((g==='ok'?0:1)-s.D);s.n=1}continue}
   const dt=t-s.last,R=recall(dt,s.S);
   if(GRADED[g]){
    if(sink&&dt>=MIN_GAP&&!s.seed){const p=(1-P.slip)*R,y=g==='ok'?1:0;
     if(arr)arr.push({t,p,y});else if(t>=acc.lo&&t<acc.hi){const q=clampP(p);acc.ll+=y?Math.log(q):Math.log(1-q);acc.n++}}
    s.seed=0;
    if(g==='ok'){const k=(1.5-s.D)/1.2,grow=1+P.gain*k*Math.pow(s.S,-0.2)*(Math.exp(1.5*(1-R))-1)/GROW_REF;s.S=clampS(s.S*clamp(grow,1,GROW_MAX))}
    else if(g==='near')s.S=clampS(s.S*Math.sqrt(P.lapse));

/* the memory model, laid open: what it estimates, from how much, and how well it predicted your newest answers */
function drawModel(){const el=document.getElementById('model');if(!el)return;
 const f=MEM.model(),rep=f&&f.report,P=f?f.params:ENGINE.model.DEFAULTS,R=MEM.readiness(vis()),pct=x=>Math.round(x*100),n=AL.count();
 const dur=d=>d<1?`${Math.max(1,Math.round(d*24))} h`:d<10?`${d.toFixed(1)} days`:`${Math.round(d)} days`;
 const status=AL.frozen()?'This device holds an answer log from a newer version of the app; it is left as it is.'
  :!f?(MEM.running()?'Fitting…':`Not fitted yet (${n} events logged).`)
  :f.chosen==='default'?`Starting values: ${rep.n} of the ${rep.minFit} answers after a break (an hour or more away from the term) it needs before it fits them to you.`
  :`Fitted to your ${rep.n} answers after a break (an hour or more away from the term): one forgetting rate for everything${f.chosen==='family'?', plus a rate per kind of question, which predicted your newest answers better':rep.test?'. Rates per kind of question are not used: they did not predict your newest answers better':` (rates per kind of question are tried from ${rep.minCompare} answers)`}.`;
 const fams=f&&(f.chosen==='family'?f.mult:rep&&rep.familyIfUsed)||{},cnt=rep&&rep.familyCounts||{};
 const famRows=Object.keys(fams).filter(k=>cnt[k]).sort((a,b)=>fams[a]-fams[b]).map(k=>{const m=fams[k];
  return `<tr><td>${esc(ENGINE.families.label(k))}</td><td>${m<0.95?`${(1/m).toFixed(1)}× faster`:m>1.05?`${m.toFixed(1)}× slower`:'as everything'}</td><td>${cnt[k]}</td></tr>`}).join('');
 const cal=(rep&&(rep.testCalib||rep.calib)||[]).filter(b=>b.n>=5);
 const rows=[
  ['Readiness',`${pct(R.score)}% ${EXAM.at>Date.now()?`on the test (${esc(EXAM.en)})`:'a day from now'} if you stopped now · ${R.below.length} of ${R.n} terms under 95%`],
  ['Status',esc(status)],
  ['After a first right answer',`90% recall for ${dur(P.s0)}, 50% after ${dur(P.s0*ENGINE.model.HALF)}`],
  ['A right answer after a break',`makes it last up to ${(1+P.gain).toFixed(1)}× longer (more when it was nearly forgotten, less for a difficult term)`],
  ['After a miss',`it lasts ${pct(P.lapse)}% as long (and starts again from a first answer at most)`],
  ['Slips',`${pct(P.slip)}% of the time on a term you know (typo, ogonek)`]];
 if(rep&&rep.test)rows.push(['Check on your newest 20%',`fitted on the older ${rep.test.train}, tested on ${rep.test.n}: log loss ${rep.test.global.toFixed(3)} with one rate, ${rep.test.family.toFixed(3)} per kind (lower is better)`]);
 rows.push(['Answer log',`${n} events · ${Math.round(AL.bytes()/1024)} kB on this device${f?` · fitted ${new Date(MEM.fittedAt()).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'})}`:''}`]);
 el.innerHTML=`<div class="tw"><table class="mtab"><tbody>${rows.map(([k,v])=>`<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</tbody></table></div>
  ${famRows?`<p class="note"><b>Forgetting per kind of question</b>${f.chosen==='family'?'':' (estimated, not used)'}: pulled toward the overall rate until there are enough answers.</p><div class="tw"><table><thead><tr><th>kind</th><th>forgets</th><th>answers</th></tr></thead><tbody>${famRows}</tbody></table></div>`:''}
  ${cal.length?`<p class="note"><b>Does it hold?</b> ${rep.testCalib?'On your newest answers (not used for fitting):':'On your answers so far:'} predicted chance → how often you were right.</p><div class="tw"><table><thead><tr><th>predicted</th><th>right</th><th>answers</th></tr></thead><tbody>${cal.map(b=>`<tr><td>${pct(b.p)}%</td><td>${pct(b.y)}%</td><td>${b.n}</td></tr>`).join('')}</tbody></table></div>`:''}
  <div class="sy-row"><button class="ghost" id="m-refit">${L('Przelicz teraz','fit again now','przeliczyć = to recalculate')}</button><button class="ghost" id="m-exp">${L('Pobierz dane','download the answer log (JSON)','pobrać = to download')}</button></div>`;
 $('#m-refit').onclick=()=>{MEM.refit();drawModel()};
 $('#m-exp').onclick=()=>{try{const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),log:AL.wire(),model:MEM.model()})],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='polski-answers.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}catch(e){}}}

/* an unfinished round is kept on this device, so stopping (✕, closing the app) resumes at the same exercise */
const SK='pl-test1-round';
function saveSess(){if(!sess)return;try{localStorage.setItem(SK,JSON.stringify({title:sess.title,test:!!sess.test,nut:!!sess.nut,drill:!!sess.drill,i:sess.i,answeredAt:sess.answeredAt,fresh:sess.fresh,stage0:sess.stage0,
 sid:sess.sid,mode:sess.mode,extra:sess.extra||0,nutStatus:sess.nutStatus||null,ready0:sess.ready0??null,introduced:[...(sess.introduced||[])],
 queue:sess.queue.map(e=>({id:e.it.id,st:e.st,slot:e.slot,retry:!!e.retry,again:!!e.again,tries:e.tries||0,practice:!!e.practice,burst:e.burst||null,...(e.confirm?{confirm:true}:{})})),
 log:sess.log.map(l=>({id:l.it.id,res:l.res,given:l.given,retry:!!l.retry,counts:!!l.counts,firstTry:!!l.firstTry,slot:l.slot,...(l.eid?{eid:l.eid}:{})})),done:[...(sess.done||[])],at:Date.now()}))}catch(e){}}
function savedSess(){try{const o=JSON.parse(localStorage.getItem(SK)||'null');if(!o||!o.queue||o.i>=o.queue.length)return null;
 if(Date.now()-(o.at||0)>3*864e5)return null;return o}catch(e){return null}}
function clearSess(){try{localStorage.removeItem(SK)}catch(e){}}
function resumeSess(){const o=savedSess();if(!o)return false;const byId=id=>ITEMS.find(x=>x.id===id)||REV_INF.find(x=>x.id===id);
 const queue=o.queue.map(e=>({...e,it:byId(e.id)})).filter(e=>e.it);
 const log=o.log.map(l=>{const it=byId(l.id);return it?{...l,it,q:it.make()}:null}).filter(Boolean);
 let i=Math.min(o.i,queue.length);if(o.answeredAt===o.i)i++;if(i>=queue.length){clearSess();return false}
 start(queue,o.title,o.test,{i,log,fresh:o.fresh||0,done:new Set(o.done||[]),stage0:o.stage0,nut:!!o.nut,drill:!!o.drill,
  ...(o.sid?{sid:o.sid}:{}),...(o.mode?{mode:o.mode}:{}),extra:o.extra||0,nutStatus:o.nutStatus||null,ready0:o.ready0??null,introduced:new Set(o.introduced||[])});return true}
/* the kind of round, as the answer log records it */
const sessMode=(title,test,o)=>o.mode||(test?'test':o.nut?'nut':o.drill?'drill':title==='Nauka'?'learn':title==='Popraw błędy'?'fix':title==='Powtórka'?'again':'deck');
function start(queue,title,test,restore){clearSess();restore=restore||{};
 sess={title,test,queue,i:0,log:[],fresh:0,stage0:currentStage(),...restore,sid:restore.sid||Date.now().toString(36)+Math.random().toString(36).slice(2,5),mode:sessMode(title,test,restore)};
 const put=(e,off)=>sess.queue.splice(Math.min(sess.queue.length,sess.i+off),0,e);sess.put=put;nav.hidden=true;app.className='app quiz';saveSess();ask()}

 const form=f=>{if(!v.stem)return `<b class="end">${esc(f)}</b>`;const sie=f.endsWith(' się'),core=sie?f.slice(0,-4):f;return esc(v.stem)+`<b class="end">${esc(core.slice(v.stem.length))}</b>`+(sie?' się':'')};
 return{eyebrow:`Czasownik · ${v.fam==='am'?(v.model?'model verb of the -am / -asz family':'-am / -asz family'):'irregular verb'}`,title:`${inf} · ${v.en} · ${half==='sg'?'singular':'plural'}`,

const BLOCKS={

 formal:{eyebrow:'Formal “you”',title:'pan, pani, państwo…',html:()=>`<div class="tw"><table class="btab"><tbody>${FORMAL.map(([en,pl])=>ROWSAY(pl,esc(en),`<b class="end">${esc(pl)}</b>`)).join('')}</tbody></table></div><div class="fam"><p>Nouns, not pronouns: the verb takes the <b>on / ona</b> form with pan and pani (pan jest), and the <b>oni</b> form with państwo, panowie, panie (państwo są).</p></div>`},

'cf:formal':{eyebrow:'Pattern · formal questions',title:'pan / pani + the on / ona form',concept:1,html:()=>`<div class="tw"><table class="btab"><thead><tr><th>to a friend</th><th>formal</th></tr></thead><tbody>${[['Jak masz na imię?','Jak ma pan na imię?'],['Skąd jesteś?','Skąd pani jest?'],['Gdzie mieszkasz?','Gdzie pan mieszka?']].map(([a,b2])=>ROWSAY(b2,esc(a),`<b class="end">${esc(b2)}</b>`)).join('')}</tbody></table></div><div class="fam"><p>Replace <b>ty</b> by <b>pan</b> (a man) or <b>pani</b> (a woman), and put the verb in the <b>on / ona</b> form: masz → ma, jesteś → jest, mieszkasz → mieszka, nazywasz się → nazywa się.</p><p>From here every question is written straight away.</p></div>`},

 'cf:sentence':{eyebrow:'Pattern · verbs in sentences',title:'Who does it? Use that form.',concept:1,html:()=>`<div class="tw"><table class="btab"><tbody>${[['We are from France.','Jesteśmy z Francji.','jesteśmy','we → my-form'],['They have a problem.','Oni mają problem.','mają','oni → oni-form'],['Michael lives in Kraków.','Michael mieszka w Krakowie.','mieszka','one person (a name) → on-form']].map(([en,pl,a,m])=>ROWSAY(pl,`${esc(pl)} <span class="muted">· ${esc(en)} · ${m}</span>`,`<b class="end">${a}</b>`)).join('')}</tbody></table></div><div class="fam"><p>From now on you translate the whole English sentence. Find the verb from the meaning, then who does it: a name or pan / pani takes the on-form; two or more people take the oni-form.</p><p>Polish usually leaves out ja, ty, my and wy: Mieszkamy w Krakowie. Writing them is not wrong. Stuck? Podpowiedź shows the verb first, then its family, then the start of the sentence.</p></div>`},

/* ---------- modes: what kind of exercise this is, named by what you do, so later lessons fit too ----------

   tlum         English → Polish
   znacz        Polish → English (or what a short form stands for)
   przeksz      turn one Polish sentence into another (formal / informal now; later past tense, negation, plural …)

   dekl         the form of a noun, adjective, pronoun or number: case, gender, number

 tlum:{pl:'Tłumaczenie',en:'translation',gr:'English → Polish',ic:MI('<path d="M3 5h8"/><path d="M7 3v2c0 4-2 7-4 8"/><path d="M5 9c1 2 3 3.5 5 4"/><path d="m12 21 4.5-10L21 21"/><path d="M13.5 18h6"/>')},
 przeksz:{pl:'Przekształcenie',en:'rephrase',gr:'turn one Polish sentence into another',ic:MI('<path d="M17 3l4 4-4 4"/><path d="M3 11V9a2 2 0 0 1 2-2h16"/><path d="M7 21l-4-4 4-4"/><path d="M21 13v2a2 2 0 0 1-2 2H3"/>')},

function modeOf(it,q){const id=it.id,eb=String(q.eyebrow||'');
 if(q.reveal||/^What does it mean|which number\?/.test(eb))return {m:'znacz'};
 if(/^ab:/.test(id))return {m:'znacz',d:['skrót','abbreviation: write it out']};

 if(/^qa:[a-z]+:form$/.test(id)){const g=/\bpani\b/i.test(String(q.answer))?'pani':'pan';return {m:'przeksz',d:[`na ${g}`,`make it formal, to a ${g==='pan'?'man':'woman'}`]}}

 if(/^kr:/.test(id)){const nom=id.split(':')[1].split(' · ')[0],c=COUNTRIES.find(x=>x[1].split(' · ')[0]===nom);return {m:'dekl',plate:{w:nom,en:c?c[0]:'',tag:['z + dopełniacz','z (from) + the genitive']}}}

/* the grammar rules, as the cheat sheet lists them */
const ruleList=L=>Object.values(RULES).filter(r=>r.t&&r.L===L).map(r=>`<p class="rule"><b>${esc(r.t)}</b> <span class="muted">· module ${r.m}</span><br>${esc(r.x)}</p>`).join('');
/* what an option means (shown after answering a multiple-choice question) */
let MEANS=null;
function meanTable(){if(MEANS)return MEANS;const m=new Map(),put=(k,v)=>{if(k&&v&&!m.has(k))m.set(k,v)};
 CLASS.forEach(([pl,en])=>{put(pl,en);put(en,'= '+pl)});WORDS.forEach(([pl,en])=>{put(pl,en);put(en,'= '+pl)});ABBR.forEach(([ab,f])=>{const g=GLW(f);put(f,g?g.split('|')[0]:f)});
 QA.forEach(q=>{put(q.inf,q.en);put(q.form,q.en+' (formal)');put(q.third,q.en3.replace(/^Ask about (him|her): /,'').replace(/^./,c=>c.toUpperCase()));put(q.ans3,q.fact);put(q.trap,'✗ mixes the ty-form with pan / pani: use the on / ona form');put(q.en,'= '+q.inf)});
 PRON_CORE.forEach(([en,pl])=>put(en,'= '+pl));FORMAL.forEach(([en,pl])=>put(`“you”, formal: ${en}`,'= '+pl));
 return MEANS=m}

 ITEMS.forEach(it=>{for(let k=0;k<6;k++){const q=it.make();const cands=[...(q.accept||[]),...(q.valid||[]),q.mcAnswer||q.answer].filter(Boolean);
  cands.forEach(a=>{a=String(a).replace(/^For example: /,'');if(isEn(a)||/^\d+$/.test(a))return;const key=strip(norm(a));if(!key||ANS.has(key))return;
   let mn=meaningOf(a,q);if(!mn&&isEn(q.prompt))mn=q.prompt;const en=String(q.prompt||'').includes('___')?null:enRef(q);if(mn||en)ANS.set(key,{text:a,mean:mn||en,en,id:it.id})})}});
 return ANS}
function confusedWith(given,q){const g=strip(norm(given));if(!g)return null;const own=new Set([...(q.accept||[]),...(q.valid||[]),q.mcAnswer||q.answer].filter(Boolean).map(a=>strip(norm(String(a).replace(/^For example: /,'')))));
 const idx=answerIndex();let hit=idx.get(g);
 /* a near miss only counts as that other answer when the difference is a spelling slip: a word you wrote that is itself
    a real form (ma for masz) is a different word, so “Jak ma na imię” is not read as “Jak masz na imię?” (feedback #4) */
 const slipOnly=(a,b)=>{const A=a.split(' '),B=b.split(' ');return A.length===B.length&&A.every((w,i)=>w===B[i]||!foldLookup(w).length)};
 if(!hit){let best=null;idx.forEach((v,k)=>{if(Math.abs(k.length-g.length)>2)return;const d=editOps(g,k).dist,lim=k.length>=8?2:1;if(d<=lim&&(!best||d<best.d)&&slipOnly(g,k))best={d,v}});hit=best&&best.v}
 if(!hit||own.has(strip(norm(hit.text)))||hit.id===q.id)return null;return hit}
function meaningOf(opt,q){if(q.mean&&q.mean[opt])return q.mean[opt];if(/^\d+$/.test(opt)&&NUMS[+opt])return '= '+NUMS[+opt];const t=meanTable().get(opt);if(t)return t;
 const ws=String(opt).split(PL_LETTER).filter((x,i)=>i%2);if(!ws.length)return null;
 const A=analyse(tokens(opt)),g=ws.map((w,k)=>glossAt(A,k)).filter(Boolean);if(!g.length)return null;
 if(ws.length===1){const [mm,f]=g[0].split('|');return f?`${mm} · ${f}`:mm}
 return g.length===ws.length?g.map(x=>x.split('|')[0].split(' · ')[0]).join(' ')+' (word by word)':null}

let kbuf='';

 if(!sess||e.metaKey||e.ctrlKey||e.altKey||document.getElementById('review'))return;const opts=[...document.querySelectorAll('.opts .opt')];

<script>
/* ---------- sync between devices through a private GitHub gist ---------- */
(function(){
 const TK='pl-gh-token',GI='pl-gh-gist',DESC='polski-test-1 progress',API='https://api.github.com';
 const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
 let state={msg:'',busy:false,last:null},timer=null,form=false,showTok=false;
 const hdr=()=>({'Authorization':'Bearer '+get(TK),'Accept':'application/vnd.github+json','Content-Type':'application/json'});
 async function gh(path,opt){const r=await fetch(API+path,{...opt,headers:hdr()});if(!r.ok){const e=new Error(r.status===401?'The token was not accepted. Create a new one and paste it again.':r.status===403||r.status===404?'The token has no access to gists. Make sure the “gist” box is ticked.':'GitHub answered '+r.status+'.');e.status=r.status;throw e}return r.json()}
 async function findGist(){let id=get(GI);if(id)return id;
  const list=await gh('/gists?per_page=100');const g=list.find(x=>x.description===DESC);
  if(g){set(GI,g.id);return g.id}
  const c=await gh('/gists',{method:'POST',body:JSON.stringify({description:DESC,public:false,files:{'progress.json':{content:JSON.stringify(S)},'answers.json':{content:JSON.stringify(AL.wire())}}})});set(GI,c.id);return c.id}
 /* a gist file's text (GitHub cuts long files short in the API answer: the full text is at raw_url) */
 async function fileText(f){if(!f)return null;if(f.truncated){const r=await fetch(f.raw_url);if(!r.ok)throw new Error('GitHub answered '+r.status+'.');return r.text()}return f.content}
 async function syncNow(){if(!get(TK)||state.busy)return;state.busy=true;state.msg='Syncing…';draw();
  try{const id=await findGist();let g;try{g=await gh('/gists/'+id)}catch(e){if(e.status===404){set(GI,null);state.busy=false;return syncNow()}throw e}
   const f=g.files&&g.files['progress.json'];let remote={};
   if(f){const txt=await fileText(f);try{remote=JSON.parse(txt)||{}}catch(e){remote={}}}
   /* the answer log (answers.json): merged as a union of events, so no answer is lost or counted twice */
   const fa=g.files&&g.files['answers.json'];let ra=null,raTxt=null;
   if(fa){raTxt=await fileText(fa);try{ra=JSON.parse(raTxt)}catch(e){ra=null}}
   const merged=mergeS(S,remote);
   /* always take in the other device's progress (the more-practised copy of each term wins, so a running round is safe) */
   {const before=JSON.stringify(S),logV=AL.version();S=merged;saveLocal();
    var aw=AL.mergeWire(ra);AL.seedFrom(S);if(aw)aw=AL.wire();
    if((JSON.stringify(S)!==before||AL.version()!==logV)&&!sess&&view==='home')home()}
   const files={};
   if(JSON.stringify(merged)!==JSON.stringify(remote))files['progress.json']={content:JSON.stringify(merged)};
   /* aw is null when the remote log was written by a newer version of the app: it is left as it is */
   if(aw){const t=JSON.stringify(aw);if(t!==raTxt)files['answers.json']={content:t}}
   if(Object.keys(files).length)await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({files})});
   state.last=new Date();state.msg=''}
  catch(e){state.msg=e.message||'Could not reach GitHub. Progress is safe on this device and syncs next time.'}
  state.busy=false;draw()}
 window.onProgressSaved=()=>{if(!get(TK))return;clearTimeout(timer);timer=setTimeout(syncNow,4000)};
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
 function draw(){const el=document.getElementById('sync');if(!el)return;const on=!!get(TK);
  if(form){el.innerHTML=`<span class="sy-box"><b>Sync between devices</b>
   <span>1. On GitHub, <a href="https://github.com/settings/tokens/new?scopes=gist&description=Polski%20sync" target="_blank" rel="noopener">create a token</a> with only the “gist” box ticked, then tap Generate token and copy it.</span>
   <span>2. Paste it here (it replaces any token saved before). Use the same token on your other device.</span>
   <input id="sy-in" type="password" autocomplete="off" placeholder="ghp_…" aria-label="GitHub token">
   <span class="sy-row"><button class="ghost" id="sy-save">Save and sync</button><button class="ghost" id="sy-x">Cancel</button></span></span>`;
   document.getElementById('sy-save').onclick=()=>{const v=document.getElementById('sy-in').value.trim();if(!v)return;set(TK,v);set(GI,null);form=false;syncNow()};
   document.getElementById('sy-x').onclick=()=>{form=false;draw()};return}
  const t=state.last?state.last.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):null;
  el.innerHTML=on?`${state.msg&&state.msg!=='Syncing…'?L('Problem z synchronizacją','sync problem')+': '+esc(state.msg):state.msg==='Syncing…'?L('Synchronizuję…','syncing…','synchronizować, ja-form'):L('Zsynchronizowano','synced between your devices','past passive form')+(t?' · '+L('ostatnio','last')+' '+t:'')}<br><button class="sy-link" id="sy-now">${L('Synchronizuj teraz','sync now','synchronizować, imperative')}</button> · <button class="sy-link" id="sy-tok">${L('Pokaż token','show token for another device','pokazać, imperative')}</button> · <button class="sy-link" id="sy-chg">${L('Zmień token','change token','zmienić, imperative')}</button> · <button class="sy-link" id="sy-off">${L('Wyłącz','turn off','wyłączyć, imperative')}</button>
   ${showTok?`<span class="sy-box"><b>Your sync token</b><span>Paste it on your other device under “Sync between devices”. Keep it private: it gives access to your gists.</span><input id="sy-tokv" type="text" readonly value="${esc(get(TK))}"><span class="sy-row"><button class="ghost" id="sy-copy">Copy</button><button class="ghost" id="sy-hide">Hide</button></span></span>`:''}`
   :`${L('Postęp tylko na tym urządzeniu.','progress is saved on this device only','na + locative: tym urządzeniu = this device')} <button class="sy-link" id="sy-on">${L('Ustaw synchronizację','set up sync','ustawić, imperative · synchronizację = accusative')}</button>`;
  const b1=document.getElementById('sy-on');if(b1)b1.onclick=()=>{form=true;draw()};
  const b2=document.getElementById('sy-now');if(b2)b2.onclick=syncNow;
  const bt=document.getElementById('sy-tok');if(bt)bt.onclick=()=>{showTok=true;draw()};
  const bh=document.getElementById('sy-hide');if(bh)bh.onclick=()=>{showTok=false;draw()};
  const bc=document.getElementById('sy-copy');if(bc)bc.onclick=()=>{const v=document.getElementById('sy-tokv');navigator.clipboard&&navigator.clipboard.writeText(v.value).then(()=>{bc.textContent='Copied'},()=>{v.select()})||v.select()};
  const bg=document.getElementById('sy-chg');if(bg)bg.onclick=()=>{form=true;draw()};
  const b3=document.getElementById('sy-off');if(b3)b3.onclick=()=>{set(TK,null);set(GI,null);state.last=null;state.msg='';draw()}}
 /* also sync each time the home screen is shown (at most every 20 s) */
 let lastHomeSync=0;const _home=window.home;window.home=function(){const r=_home.apply(this,arguments);
  if(!get(TK)){const a=document.getElementById('app');if(a&&!document.getElementById('sy-top')){a.insertAdjacentHTML('afterbegin','<button class="sybar" id="sy-top">'+ICON.nosync.replace('<svg','<svg class="sbi"')+L('Brak synchronizacji · ustaw','this device is not synced · set up sync','brak + genitive = no …, lack of …')+'</button>');document.getElementById('sy-top').onclick=()=>{settingsView();form=true;draw();const el=document.getElementById('sync');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}}}if(get(TK)&&Date.now()-lastHomeSync>20000){lastHomeSync=Date.now();setTimeout(syncNow,50)}return r};

})();
</script>

   const q=getQ();q.push({snip,txt,ctx});setQ(q);const m=await flush();document.getElementById('fbmsg').innerHTML=m;
   if(/^Sent/.test(m))setTimeout(close,900);else{document.getElementById('fbsend').hidden=true;document.getElementById('fbcancel').textContent='OK'}}}
 async function flush(){const q=getQ();if(!q.length)return '';const t=tok();
  if(!t)return 'Saved on this device. It is sent automatically once sync is set up (Ustawienia → Synchronizacja).';
  const left=[];let msg='Sent. Thanks!';
  for(const f of q){const body='**Selected:** '+f.snip+'\n\n**Comment:** '+f.txt+'\n\n```json\n'+JSON.stringify(f.ctx,null,1)+'\n```';
   const post=labels=>fetch(API+'/repos/'+REPO+'/issues',{method:'POST',headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({title:'Feedback: '+f.txt.slice(0,70),body,...(labels?{labels:['feedback']}:{})})});
   try{let r=await post(1);if(r.status===422)r=await post(0);
    if(!r.ok){left.push(f);msg=(r.status===401||r.status===403||r.status===404)?'Saved, not sent yet: your token cannot create issues. On GitHub open <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">Settings → Tokens</a>, open your token, tick <b>public_repo</b> and tap Update token (the token itself stays the same). It is then sent automatically.':'Saved, not sent yet (GitHub answered '+r.status+'). It is retried automatically.'}}
   catch(e){left.push(f);msg='Saved, not sent yet: no connection. It is retried automatically.'}}
  setQ(left);return msg}
 setTimeout(flush,3000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')flush()});
})();
</script>
